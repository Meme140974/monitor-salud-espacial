services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: salud_espacial
      POSTGRES_USER: astro
      POSTGRES_PASSWORD: artemis2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astro -d salud_espacial"]
      interval: 2s
      timeout: 3s
      retries: 15

  web:
    build: .
    command: >
      sh -c "python manage.py makemigrations salud rutinas &&
             python manage.py migrate &&
             python manage.py seed_demo &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      POSTGRES_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  pgdata:
